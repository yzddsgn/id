<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://yzddsgn.github.io/id/login/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">
    <title>Login - YZD DSGN</title>
</head>

<body>

    <div class="login-page">
        <div class="login-card">
            <div class="brand">
                YZD<span>DSGN</span>
            </div>

            <div class="login-header">
                <p class="login-label">WELCOME BACK</p>
                <h1>Login</h1>
                <p class="login-desc">
                    Masuk untuk melanjutkan belanja
                    koleksi kaos favorit kamu.
                </p>
            </div>


            <button id="googleLogin" class="google-login">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4"
                        d="M21.35 12.23c0-.78-.07-1.53-.2-2.25H12v4.26h5.23a4.47 4.47 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.92-4.2 2.92-7.4Z" />

                    <path fill="#34A853"
                        d="M12 21.75c2.63 0 4.84-.87 6.45-2.37l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.75Z" />

                    <path fill="#FBBC05"
                        d="M6.53 13.82a5.86 5.86 0 0 1 0-3.64V7.65H3.29a9.75 9.75 0 0 0 0 8.7l3.24-2.53Z" />

                    <path fill="#EA4335"
                        d="M12 6.15c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.83 3.22 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.71 5.4l3.24 2.53C7.3 7.87 9.46 6.15 12 6.15Z" />
                </svg>
                <span>Continue with Google</span>
            </button>

            <div class="login-divider">
                <span>SECURE LOGIN</span>
            </div>

            <div class="login-info">
                <span class="info-dot"></span>
                <p>
                    Login menggunakan akun Google
                    kamu untuk keamanan akun.
                </p>
            </div>
            <img id="userPhoto" class="user-photo" alt="Profile">
        </div>


        <div class="login-footer">
            © 2026 YZD DSGN. All Rights Reserved.
        </div>

    </div>

    <script type="module" src="https://yzddsgn.github.io/id/login/js/auth.js"></script>

</body>

</html>
